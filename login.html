<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coder's Website Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide overflow to prevent scroll bars */
            position: relative;
            background: linear-gradient(135deg, #000000, #001a00);
        }

        .container {
            position: relative;
            z-index: 1;
            background-color: rgba(6, 35, 40, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin: 0 auto;
            margin-top: 10%;
            text-align: center;
            color: #ffffff; /* Neon color */
        }

        h2 {
            margin-bottom: 20px;
            color: #00ffcc; /* Neon green color */
        }

        input[type="text"],
        input[type="password"],
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #00ffcc; /* Neon green color */
            border-radius: 5px;
            box-sizing: border-box;
            background-color: transparent;
            color: #ffffff; /* Neon color */
            outline: none;
        }

        input[type="submit"] {
            background-color: #00ffcc; /* Neon green color */
            color: #000000; /* Black color */
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #00e6b8; /* Lighter shade of neon green */
        }

        .signup-link {
            text-align: center;
            margin-top: 10px;
            color: #ffffff; /* Neon color */
        }

        .signup-link a {
            color: #00ffcc; /* Neon green color */
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Move the canvas behind other elements */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login to Coder's Website</h2>
        <form action="check_login.php" method="post" onsubmit="loginUser(); return false;">
            <input type="text" name="username" id="username" placeholder="Username" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <input type="submit" value="Login" onclick="loginUser()">
            
        </form>
        <div class="signup-link">
            <p>Don't have an account? <a href="signuppage.html">Sign up here</a></p>
        </div>
        
    
    

    <canvas id="c"></canvas>
    <script>
        function loginUser() {
    var username = $('#username').val();
    var password = $('#password').val();

    if (username === '' || password === '') {
        alert('Please fill in all fields.');
        return;
    }

    $.ajax({
        type: 'POST',
        url: 'check_login.php',
        data: {
            username: username,
            password: password
        },
        success: function(response) {
            if (response == "1") {
                alert('User logged in successfully!');
                window.location.href = 'home.html';
            } else {
                alert(response);
            }
        },
        error: function(xhr, status, error) {
            console.error(xhr.responseText);
            alert('An error occurred while logging in.');
        }
    });
}

    </script>
    <script>
        var c = document.getElementById("c");
        var ctx = c.getContext("2d");

        //making the canvas full screen
        c.height = window.innerHeight;
        c.width = window.innerWidth;

        //chinese characters - taken from the unicode charset
        var matrix = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        //converting the string into an array of single characters
        matrix = matrix.split("");

        var font_size = 10;
        var columns = c.width / font_size; //number of columns for the rain
        //an array of drops - one per column
        var drops = [];
        //x below is the x coordinate
        //1 = y co-ordinate of the drop(same for every drop initially)
        for (var x = 0; x < columns; x++)
            drops[x] = 1;

        //drawing the characters
        function draw() {
            //Black BG for the canvas
            //translucent BG to show trail
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, c.width, c.height);

            ctx.fillStyle = "#00ff00"; //green text
            ctx.font = font_size + "px arial";
            //looping over drops
            for (var i = 0; i < drops.length; i++) {
                //a random chinese character to print
                var text = matrix[Math.floor(Math.random() * matrix.length)];
                //x = i*font_size, y = value of drops[i]*font_size
                ctx.fillText(text, i * font_size, drops[i] * font_size);

                //sending the drop back to the top randomly after it has crossed the screen
                //adding a randomness to the reset to make the drops scattered on the Y axis
                if (drops[i] * font_size > c.height && Math.random() > 0.975)
                    drops[i] = 0;

                //incrementing Y coordinate
                drops[i]++;
            }
        }

        setInterval(draw, 35);
    </script>
</body>
</html>
