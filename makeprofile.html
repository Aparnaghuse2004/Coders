<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makeprofile</title>
    <style>
        .container {
    display: flex;
    justify-content: center;
    align-items: center;
    
   
}
    #profileForm {
        background:rgba(6, 35, 40, 0.8);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
    }
    
    /* Choose image button */
    .choose-image-btn {
        display: inline-block;
        background-color: #007bff;
        color: #fff;
        padding: 10px 20px;
        border-radius: 4px;
        text-align: center;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-bottom: 20px;
        text-decoration: none;
    }
    
    .choose-image-btn:hover {
        text-align: center;
        background-color: #0056b3;
    }
    
    /* Profile image */
    .profile-image {
        display: block;
        margin: 0 auto 20px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #dddddd57;
    }
    
    /* Profile info */
    .profile-info {
       background-color: transparent;
        display: flex;
        flex-direction: column;
      
        gap: 10px;
    }
    
    .profile-info label {
        color: #fff;
        font-weight: 600;
        margin-bottom: 5px;
    }
    
    .profile-info input,
    .profile-info select {
        background-color: transparent;
        color: #fff;
        padding: 10px;
        border: 1px solid #00ffcc;;
        border-radius: 4px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .profile-info input[type="submit"] {
        background-color: #007bff;
        color: #ffffff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    
    .profile-info input[type="submit"]:hover {
        background-color: #0056b3;
    }
    canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Move the canvas behind other elements */
        }
        </style>
    </head>
    <body>
        <script src="canvas.js"></script>
        <canvas id="c"></canvas>
    
    <div class="container">
        <form id="profileForm" enctype="multipart/form-data" method="post">
            <input type="file" id="profileImage" name="profileImage" accept="image/*" onchange="previewImage(event)" style="display: none;">
            <label for="profileImage" class="choose-image-btn">Choose Profile Image</label>
            <img src="placeholder.jpg" alt="Profile Picture" id="preview" class="profile-image">
            <div class="profile-info">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>
                <label for="occupation">Occupation:</label>
                <input type="text" id="occupation" name="occupation" required><br>
                <label for="age">Age:</label>
                <input type="text" id="age" name="age" required><br>
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select><br>
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
    
    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var preview = document.getElementById('preview');
                preview.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    
        document.getElementById("profileForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent the form from submitting
    
            var formData = new FormData(this);
    
            // Send the form data using AJAX
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'createprofile.php', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    // Display the response if needed
                    console.log(xhr.responseText);
                    alert(xhr.responseText);
                    window.location.href = 'home.html';
                } else {
                    alert("An error occurred while submitting the form. Please try again.");
                }
            };
            xhr.send(formData);
        });
    </script>
    <script>
        var c = document.getElementById("c");
var ctx = c.getContext("2d");

//making the canvas full screen
c.height = window.innerHeight;
c.width = window.innerWidth;

//chinese characters - taken from the unicode charset
var matrix = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
//converting the string into an array of single characters
matrix = matrix.split("");

var font_size = 10;
var columns = c.width / font_size; //number of columns for the rain
//an array of drops - one per column
var drops = [];
//x below is the x coordinate
//1 = y co-ordinate of the drop(same for every drop initially)
for (var x = 0; x < columns; x++)
    drops[x] = 1;

//drawing the characters
function draw() {
    //Black BG for the canvas
    //translucent BG to show trail
    ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
    ctx.fillRect(0, 0, c.width, c.height);

    ctx.fillStyle = "#00ff00"; //green text
    ctx.font = font_size + "px arial";
    //looping over drops
    for (var i = 0; i < drops.length; i++) {
        //a random chinese character to print
        var text = matrix[Math.floor(Math.random() * matrix.length)];
        //x = i*font_size, y = value of drops[i]*font_size
        ctx.fillText(text, i * font_size, drops[i] * font_size);

        //sending the drop back to the top randomly after it has crossed the screen
        //adding a randomness to the reset to make the drops scattered on the Y axis
        if (drops[i] * font_size > c.height && Math.random() > 0.975)
            drops[i] = 0;

        //incrementing Y coordinate
        drops[i]++;
    }
}

setInterval(draw, 35);
    </script>
    </body>
</html>
