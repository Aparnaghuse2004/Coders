<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide overflow to prevent scroll bars */
            position: relative;
        }

        .containers {
            position: relative;
            z-index: 1;
            background-color: rgba(6, 35, 40, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin: 0 auto;
            text-align: center;
            color: #ffffff; /* Neon color */
        }

        h2 {
            margin-bottom: 20px;
            color: #00ffcc /* Heading color */
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="date"],
        form select,
        form input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #00ffcc; /* Neon green color */
            border-radius: 5px;
            box-sizing: border-box;
            background-color: transparent;
            color: #ffffff; /* Neon color */
            outline: none;
        }

        form input[type="checkbox"] {
            margin-right: 5px;
            vertical-align: middle;
        }

        label {
            font-size: 14px;
            color: #555555; /* Label color */
        }

        form input[type="submit"] {
            background-color: #00ffcc; /* Submit button background color */
            color: #ffffff; /* Submit button text color */
            border: none;
            cursor: pointer;
        }

        form input[type="submit"]:hover {
            background-color: #00e6b8; /* Submit button background color on hover */
        }

        form a {
            color: #00ffcc; /* Link color */
            text-decoration: none;
        }

        form a:hover {
            text-decoration: underline;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Move the canvas behind other elements */
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div class="containers">
        <h2>Sign Up</h2>
        <form id="signupForm" action="user_registration.php" method="POST">
            <input type="text" name="full_name" placeholder="Full Name">
            <input type="text" name="username" placeholder="Username" required>
            <select name="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <input type="date" name="date_of_birth" placeholder="Date of Birth">

            <input type="text" name="country" placeholder="Country/Region">
            <input type="checkbox" id="termsAgreement" name="terms_agreement" required>
            <label for="termsAgreement">I agree to the <a href="#">Terms of Service</a></label>
            <input type="submit" value="Sign Up" onclick="registerUser()">

            <span>Already have an account?</span><a href="login.html">login</a>
        </form>
    </div>
    <script>
        function registerUser() {
            var fullName = document.querySelector('input[name="full_name"]').value;
            var username = document.querySelector('input[name="username"]').value;
            var gender = document.querySelector('select[name="gender"]').value;
            var email = document.querySelector('input[name="email"]').value;
            var password = document.querySelector('input[name="password"]').value;
            var confirmPassword = document.querySelector('input[name="confirm_password"]').value;
            var dateOfBirth = document.querySelector('input[name="date_of_birth"]').value;
            var country = document.querySelector('input[name="country"]').value;
            var termsAgreement = document.getElementById('termsAgreement').checked;

            // Perform validation
            if (!fullName || !username || !gender || !email || !password || !confirmPassword || !dateOfBirth || !country || !termsAgreement) {
                alert('Please fill in all fields.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            // Prepare data for registration
            var formData = new FormData();
            formData.append('full_name', fullName);
            formData.append('username', username);
            formData.append('gender', gender);
            formData.append('email', email);
            formData.append('password', password);
            formData.append('confirm_password', confirm_password);
            formData.append('date_of_birth', dateOfBirth);
            formData.append('country', country);
            formData.append('terms_agreement', termsAgreement);

            // Send data to server via AJAX for registration
            fetch('user_registration.php', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    return response.text();
                }
                throw new Error('Network response was not ok.');
            })
            .then(data => {
                if (data === "1") {
                    alert('User registered successfully!');
                    window.location.href = '../welcome.html';
                } else {
                    alert(data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while registering user.');
            });
        }
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script>
        // Matrix background effect
        var c = document.getElementById("c");
        var ctx = c.getContext("2d");

        // Making the canvas full screen
        c.height = window.innerHeight;
        c.width = window.innerWidth;

        // Chinese characters - taken from the unicode charset
        var matrix = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        // Converting the string into an array of single characters
        matrix = matrix.split("");

        var font_size = 10;
        var columns = c.width / font_size; // Number of columns for the rain
        // An array of drops - one per column
        var drops = [];
        // X below is the X coordinate
        // 1 = Y co-ordinate of the drop (same for every drop initially)
        for (var x = 0; x < columns; x++)
            drops[x] = 1;

        // Drawing the characters
        function draw() {
            // Black BG for the canvas
            // Translucent BG to show trail
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, c.width, c.height);

            ctx.fillStyle = "#00ff00"; // Green text
            ctx.font = font_size + "px arial";
            // Looping over drops
            for (var i = 0; i < drops.length; i++) {
                // A random Chinese character to print
                var text = matrix[Math.floor(Math.random() * matrix.length)];
                // X = i*font_size, Y = value of drops[i]*font_size
                ctx.fillText(text, i * font_size, drops[i] * font_size);

                // Sending the drop back to the top randomly after it has crossed the screen
                // Adding a randomness to the reset to make the drops scattered on the Y axis
                if (drops[i] * font_size > c.height && Math.random() > 0.975)
                    drops[i] = 0;

                // Incrementing Y coordinate
                drops[i]++;
            }
        }

        setInterval(draw, 35);
    </script>
</body>
</html>
