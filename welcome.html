<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Object</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Hide overflow to prevent scroll bars */
            position: relative;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide overflow to prevent scroll bars */
            position: relative;
        }

        .containers {
            border: #ffffff;
            border-style: solid;
            position: relative;
            z-index: 1;    
            background-color: rgba(6, 35, 40, 0.8);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin: 0 auto;
            margin-top: 15%;
            text-align: center;
            color: #ffffff; /* Neon color */
        }
        a {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #00ffcc; /* Neon green color */
            border-radius: 5px;
            box-sizing: border-box;
            background-color: transparent;
            color: #ffffff; /* Neon color */
            outline: none;
        }
        a {
            background-color: #00ffcc; /* Submit button background color */
            color: #ffffff; /* Submit button text color */
            border: none;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }

        h1 {
            margin-bottom: 20px;
            color: #333333; /* Heading color */
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Move the canvas behind other elements */
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .object {
            position: absolute;
            width: 250px;
            height: 50px;
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            border-style: dotted dashed solid double;
            padding: 10px;
            line-height: 50px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="containers">
        <h2>WELCOME TO CODER</h2>        
           <a href="login.html">login</a>
           <a href="signuppage.html">sign up</a>
    </div>
    <canvas id="c"></canvas>
    <div class="container">
        <div class="object" id="object">CODER</div>
    </div>

    <script>
        const object = document.getElementById("object");

        let posX = 0;
        let posY = 0;
        let speedX = 3;
        let speedY = 3;
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updatePosition() {
            posX += speedX;
            posY += speedY;

            // Check collision with screen boundaries
            if (posX <= 0 || posX >= screenWidth - 200) {
                speedX *= -1; // Reverse direction
                object.style.color = getRandomColor(); // Change text color
            }

            if (posY <= 0 || posY >= screenHeight - 50) {
                speedY *= -1; // Reverse direction
                object.style.color = getRandomColor(); // Change text color
            }

            object.style.left = posX + "px";
            object.style.top = posY + "px";
        }

        function animate() {
            updatePosition();
            requestAnimationFrame(animate);
        }

        animate();

        // Create matrix effect
        var c = document.getElementById("c");
        var ctx = c.getContext("2d");

        // Making the canvas full screen
        c.height = window.innerHeight;
        c.width = window.innerWidth;

        // Chinese characters - taken from the unicode charset
        var matrix = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        // Converting the string into an array of single characters
        matrix = matrix.split("");

        var font_size = 10;
        var columns = c.width / font_size; // Number of columns for the rain
        // An array of drops - one per column
        var drops = [];
        // X below is the X coordinate
        // 1 = Y co-ordinate of the drop (same for every drop initially)
        for (var x = 0; x < columns; x++)
            drops[x] = 1;

        // Drawing the characters
        function draw() {
            // Black BG for the canvas
            // Translucent BG to show trail
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, c.width, c.height);

            ctx.fillStyle = "#00ff00"; // Green text
            ctx.font = font_size + "px arial";
            // Looping over drops
            for (var i = 0; i < drops.length; i++) {
                // A random Chinese character to print
                var text = matrix[Math.floor(Math.random() * matrix.length)];
                // X = i*font_size, Y = value of drops[i]*font_size
                ctx.fillText(text, i * font_size, drops[i] * font_size);

                // Sending the drop back to the top randomly after it has crossed the screen
                // Adding a randomness to the reset to make the drops scattered on the Y axis
                if (drops[i] * font_size > c.height && Math.random() > 0.975)
                    drops[i] = 0;

                // Incrementing Y coordinate
                drops[i]++;
            }
        }

        setInterval(draw, 35);
    </script>
</body>
</html>
